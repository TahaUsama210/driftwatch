# Prometheus for the Driftwatch compose stack (profile "observability").
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-compose

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API recomputes its fleet and per-host gauges every 15 s, so scraping faster
  # would only re-read the same values.
  - job_name: driftwatch-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
