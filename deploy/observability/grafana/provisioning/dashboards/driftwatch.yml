apiVersion: 1

providers:
  - name: driftwatch
    folder: Driftwatch
    type: file
    # The JSON in grafana/dashboards is the source of truth; UI edits are not saved.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
