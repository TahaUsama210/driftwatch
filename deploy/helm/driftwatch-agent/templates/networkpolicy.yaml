{{- if and .Values.networkPolicy.enabled (not .Values.hostNetwork) }}
# No ingress (the agent serves nothing); egress to the API and DNS only.
# NetworkPolicies do not apply to hostNetwork pods, so none is rendered then.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "driftwatch-agent.fullname" . }}
  labels:
    {{- include "driftwatch-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "driftwatch-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.api.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.api.podSelector | nindent 12 }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
