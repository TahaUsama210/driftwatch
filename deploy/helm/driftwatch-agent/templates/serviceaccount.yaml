apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "driftwatch-agent.fullname" . }}
  labels:
    {{- include "driftwatch-agent.labels" . | nindent 4 }}
# The agent never calls the Kubernetes API. It already reads the whole node, so a
# token would only widen what a compromised agent could reach.
automountServiceAccountToken: false
