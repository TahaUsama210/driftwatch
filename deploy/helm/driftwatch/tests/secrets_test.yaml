suite: Secrets (explicit values, existing Secrets, generated values)
templates:
  - secrets.yaml
  - validate.yaml
release:
  name: driftwatch
  namespace: driftwatch
tests:
  - it: generates every secret when none is given
    template: secrets.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - matchRegex:
          path: metadata.name
          pattern: ^driftwatch-(enrollment|postgresql|keycloak)$
      - isNotNullOrEmpty: { path: data }

  - it: generates a 48-character enrollment token
    documentSelector: { path: metadata.name, value: driftwatch-enrollment }
    asserts:
      # 48 characters base64-encode to 64.
      - matchRegex:
          path: data.enrollment-token
          pattern: ^[A-Za-z0-9+/]{64}$

  - it: keeps the values already in the cluster on upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: driftwatch-enrollment, namespace: driftwatch }
          data:
            enrollment-token: c3RvcmVkLWVucm9sbG1lbnQtdG9rZW4tMDEyMzQ1Njc4OQ==
        - kind: Secret
          apiVersion: v1
          metadata: { name: driftwatch-postgresql, namespace: driftwatch }
          data:
            password: c3RvcmVkLWRiLXBhc3N3b3Jk
    asserts:
      - equal:
          path: data.enrollment-token
          value: c3RvcmVkLWVucm9sbG1lbnQtdG9rZW4tMDEyMzQ1Njc4OQ==
        documentSelector: { path: metadata.name, value: driftwatch-enrollment }
      - equal:
          path: data.password
          value: c3RvcmVkLWRiLXBhc3N3b3Jk
        documentSelector: { path: metadata.name, value: driftwatch-postgresql }

  - it: uses explicit values over generated or stored ones
    set:
      enrollment.token: explicit-enrollment-token-0123456789
      postgresql.auth.password: explicit-db-password
    asserts:
      - equal:
          path: data.enrollment-token
          value: ZXhwbGljaXQtZW5yb2xsbWVudC10b2tlbi0wMTIzNDU2Nzg5
        documentSelector: { path: metadata.name, value: driftwatch-enrollment }
      - equal:
          path: data.password
          value: ZXhwbGljaXQtZGItcGFzc3dvcmQ=
        documentSelector: { path: metadata.name, value: driftwatch-postgresql }

  - it: creates no Secret for values that come from existing Secrets
    template: secrets.yaml
    set:
      enrollment.existingSecret: my-enrollment
      postgresql.auth.existingSecret: my-db
      keycloak.admin.existingSecret: my-keycloak
    asserts:
      - hasDocuments: { count: 0 }

  - it: creates no database or Keycloak Secret when those components are disabled
    template: secrets.yaml
    set:
      keycloak.enabled: false
      oidc.issuer: https://idp.example.com/realms/driftwatch
      postgresql.enabled: false
      externalDatabase.host: db.example.internal
      externalDatabase.existingSecret: fleet-db
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: driftwatch-enrollment }

  - it: keeps the database password Secret when the release is uninstalled
    documentSelector: { path: metadata.name, value: driftwatch-postgresql }
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: rejects an enrollment token the API would refuse
    template: validate.yaml
    set:
      enrollment.token: too-short
    asserts:
      - failedTemplate:
          errorMessage: enrollment.token must be at least 24 characters (the API refuses to start otherwise)
