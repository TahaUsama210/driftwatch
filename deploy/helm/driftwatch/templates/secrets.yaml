{{- if not .Values.enrollment.existingSecret }}
{{- $name := include "driftwatch.componentName" (dict "ctx" . "component" "enrollment") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "driftwatch.labels" (dict "ctx" . "component" "api") | nindent 4 }}
type: Opaque
data:
  enrollment-token: {{ include "driftwatch.secretValue" (dict "ctx" . "name" $name "key" "enrollment-token" "value" .Values.enrollment.token "length" 48) }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "driftwatch.componentName" (dict "ctx" . "component" "postgresql") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "driftwatch.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  annotations:
    # The data volume outlives the release (StatefulSet PVCs are never deleted by
    # Helm), so the password that initialised it must too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "driftwatch.secretValue" (dict "ctx" . "name" $name "key" "password" "value" .Values.postgresql.auth.password "length" 32) }}
{{- end }}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.admin.existingSecret) }}
{{- $name := include "driftwatch.componentName" (dict "ctx" . "component" "keycloak") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "driftwatch.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
type: Opaque
data:
  admin-password: {{ include "driftwatch.secretValue" (dict "ctx" . "name" $name "key" "admin-password" "value" .Values.keycloak.admin.password "length" 32) }}
{{- end }}
