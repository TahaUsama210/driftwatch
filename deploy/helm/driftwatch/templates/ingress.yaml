{{- if .Values.ingress.enabled }}
# One entry point. The web nginx serves the SPA and proxies /api/, /actuator/health
# and /auth/, so the dashboard, the API and Keycloak share one origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "driftwatch.fullname" . }}
  labels:
    {{- include "driftwatch.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "driftwatch.componentName" (dict "ctx" . "component" "web") }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
