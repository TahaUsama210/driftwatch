{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "driftwatch.serviceAccountName" . }}
  labels:
    {{- include "driftwatch.labels" (dict "ctx" . "component" "") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload calls the Kubernetes API, so no token is mounted anywhere.
automountServiceAccountToken: false
{{- end }}
