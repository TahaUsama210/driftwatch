# Included at server level and again in every location that sets its own headers,
# because any add_header in a location stops nginx inheriting the server's headers.
# Not applied under /auth/: Keycloak sends its own headers for its pages.
#
# The CSP allows only same-origin resources. The app needs no inline script (the theme
# bootstrap is /theme-init.js) and no inline <style>; React applies style props through
# the CSSOM, which style-src does not restrict. For sign-in: discovery and token calls
# go to /auth on this origin (connect-src), the silent sign-in iframe loads /auth and
# then /silent-renew.html (frame-src), and the redirects to Keycloak are navigations,
# not form posts (form-action stays 'self'). frame-ancestors and X-Frame-Options come
# from maps in the server template: 'none'/DENY except for /silent-renew.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $dw_frame_ancestors" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options $dw_x_frame_options always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
