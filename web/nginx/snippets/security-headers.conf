# Included at server level and again in every location that sets its own headers,
# because any add_header in a location stops nginx inheriting the server's headers.
#
# The CSP allows only same-origin resources. The app needs no inline script (the theme
# bootstrap is /theme-init.js) and no inline <style>; React applies style props through
# the CSSOM, which style-src does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
