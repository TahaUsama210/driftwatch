# Proxy settings for Keycloak under /auth/. The $dw_forwarded_* values are mapped in
# templates/default.conf.template.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $dw_forwarded_proto;
proxy_set_header X-Forwarded-Host $dw_forwarded_host;
proxy_set_header X-Forwarded-Port $dw_forwarded_port;

# Keycloak's login and token responses carry several large Set-Cookie headers; with the
# 4k/8k defaults nginx answers 502 "upstream sent too big header".
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
error_page 502 504 = @keycloak_unreachable;
