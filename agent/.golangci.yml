version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Reports and results are small values passed on cold paths; copying
        # them keeps the code simpler than sharing pointers.
        - hugeParam
        - rangeValCopy
    govet:
      enable-all: true
      disable:
        # Field order is chosen for readability, not padding.
        - fieldalignment
        # Flags the idiomatic `if err := f(); err != nil` inside functions
        # that already have an err.
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: early-return
        - name: unexported-return
    sloglint:
      attr-only: true
      context: scope
  exclusions:
    rules:
      # Tests build fixtures with fixed modes and paths and read files they
      # created themselves.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TahaUsama210/driftwatch/agent
