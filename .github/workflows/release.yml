name: Release

# Runs on a v<version> tag (for example v0.2.0). Agents never create tags; a maintainer
# pushes one from main.
#
#   images   images.yml: ghcr.io/tahausama210/driftwatch-{api,web,agent}:<version>,
#            multi-arch, scanned, signed and attested
#   agent    driftwatch-agent_<version>_linux_{amd64,arm64}.tar.gz, checksums.txt and an
#            SPDX SBOM, with a build provenance attestation over every archive
#   charts   both Helm charts at <version>, pushed to oci://ghcr.io/tahausama210/charts
#            and signed by digest
#   release  the GitHub Release, created only after everything above succeeded
#
# Verify an archive with:
#   sha256sum --check --ignore-missing checksums.txt
#   gh attestation verify driftwatch-agent_<version>_linux_amd64.tar.gz --owner TahaUsama210

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.4
  HELM_VERSION: v4.3.0
  CHART_REPOSITORY: oci://ghcr.io/tahausama210/charts

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Tags can be pushed from any commit; only release what has been merged to main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - name: Parse the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! $TAG =~ $semver ]]; then
            echo "::error::Tag ${TAG} is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n ${BASH_REMATCH[4]} ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  images:
    name: Images
    needs: version
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  agent:
    name: Agent archives
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      # Static, stripped, path-free binaries in archives with fixed ownership, order and
      # timestamps, so the same commit always produces the same checksums.
      - name: Build archives
        run: |
          epoch=$(git log -1 --format=%ct)
          commit=$(git rev-parse --short HEAD)
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="build/linux_${arch}"
            mkdir -p "$stage"
            (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=${VERSION} -X main.commit=${commit}" \
              -o "../${stage}/driftwatch-agent" ./cmd/driftwatch-agent)
            cp LICENSE agent/README.md "$stage/"
            tar --create --directory "$stage" --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${epoch}" driftwatch-agent LICENSE README.md \
              | gzip --no-name --best >"dist/driftwatch-agent_${VERSION}_linux_${arch}.tar.gz"
          done
          (cd dist && sha256sum -- *.tar.gz >checksums.txt)
          cat dist/checksums.txt
      - name: Archives run on this runner
        run: |
          tar --extract --gzip --to-stdout --file "dist/driftwatch-agent_${VERSION}_linux_amd64.tar.gz" \
            driftwatch-agent >build/driftwatch-agent
          chmod +x build/driftwatch-agent
          build/driftwatch-agent version | grep --fixed-strings "${VERSION}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: build
          format: spdx-json
          output-file: dist/driftwatch-agent_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: dist/driftwatch-agent_${{ env.VERSION }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  charts:
    name: Helm charts
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The app version is the release version, so the charts default to the images
      # images.yml has just published for this tag.
      - name: Package, push and sign
        run: |
          mkdir -p charts
          for chart in deploy/helm/driftwatch deploy/helm/driftwatch-agent; do
            name=$(basename "$chart")
            helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination charts
            output=$(helm push "charts/${name}-${VERSION}.tgz" "$CHART_REPOSITORY" 2>&1)
            echo "$output"
            digest=$(grep --only-matching --extended-regexp 'sha256:[0-9a-f]{64}' <<<"$output" | head -n 1)
            [[ -n $digest ]] || { echo "::error::helm push printed no digest for ${name}"; exit 1; }
            cosign sign --yes "${CHART_REPOSITORY#oci://}/${name}@${digest}"
            echo "- \`${CHART_REPOSITORY}/${name}:${VERSION}\` (\`${digest}\`)" >>"$GITHUB_STEP_SUMMARY"
          done

  release:
    name: GitHub Release
    needs: [version, images, agent, charts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "Driftwatch ${VERSION}" --generate-notes)
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*
