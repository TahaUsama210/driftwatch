name: Images

# Builds, scans and publishes the api, web and agent images.
#
#   pull request   build (linux/amd64) and Trivy scan; nothing is pushed
#   push to main   the same, then multi-arch push as :main and :sha-<short>
#   release.yml    called on a v* tag: the same, pushed as :<version>
#
# Every published image is pushed by digest-addressed build, then signed with cosign
# (keyless, by digest) and given SBOM and SLSA build provenance attestations, both
# stored in the registry next to the image. Verify with:
#
#   cosign verify ghcr.io/tahausama210/driftwatch-api@<digest> \
#     --certificate-identity-regexp '^https://github.com/TahaUsama210/driftwatch/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/tahausama210/driftwatch-api@<digest> --owner TahaUsama210

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

# The "images-" prefix keeps this group distinct from the caller's when release.yml
# calls this workflow (github.workflow is the caller's name inside a called workflow).
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMS: linux/amd64,linux/arm64
  COSIGN_VERSION: v3.1.4

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Build and scan (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The scan covers the amd64 variant. Both variants come from the same Dockerfile
      # and multi-arch base images, so they carry the same package versions.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: driftwatch-${{ matrix.image }}:scan
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}
      - name: Trivy report (SARIF)
        id: sarif
        run: >-
          bash scripts/trivy.sh image --format sarif --output "trivy-${{ matrix.image }}.sarif"
          --severity HIGH,CRITICAL --ignore-unfixed "driftwatch-${{ matrix.image }}:scan"
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: >-
          bash scripts/trivy.sh image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          --skip-db-update --skip-java-db-update "driftwatch-${{ matrix.image }}:scan"
      # Fork pull requests get a read-only token, so they skip the upload; the gate above
      # still applies to them.
      - name: Upload to code scanning
        if: >-
          ${{ !cancelled() && steps.sarif.outcome == 'success'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: image-${{ matrix.image }}

  publish:
    name: Publish (${{ matrix.image }})
    needs: scan
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, agent]
    env:
      IMAGE: ghcr.io/tahausama210/driftwatch-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build stages run natively (FROM --platform=$BUILDPLATFORM); QEMU only runs the
      # few RUN steps in each arm64 runtime stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
      # BuildKit's own provenance and SBOM are off: the GitHub attestations below cover
      # both, are signed by Sigstore, and keep the image index free of unknown/unknown
      # attestation manifests.
      - name: Build and push (${{ env.PLATFORMS }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Signs the index digest, which covers every platform variant. Tags are mutable,
      # so nothing is ever signed by tag.
      - name: Sign (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      # Storage records are an organization feature; this repository is user-owned.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
