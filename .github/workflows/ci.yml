name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR or branch. Superseded PR runs are cancelled; main runs always finish
# so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool versions not managed by Dependabot; keep in sync with the Makefile.
env:
  REDOCLY_CLI_VERSION: 2.65.1
  GOLANGCI_LINT_VERSION: v2.15.0
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

defaults:
  run:
    shell: bash

jobs:
  config:
    name: Config (workflows, scripts, compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color
      - name: shellcheck
        run: docker run --rm --volume "$PWD:/mnt" "$SHELLCHECK_IMAGE" scripts/*.sh
      - name: Compose file is valid
        run: docker compose config --quiet

  contract:
    name: Contract (OpenAPI lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Redocly lint
        run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint --format=github-actions contracts/openapi.yaml

  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          # The agent uses only the standard library, so there is no go.sum to key on.
          cache-dependency-path: agent/go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: agent
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./cmd/driftwatch-agent
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-coverage
          path: agent/coverage.out
          if-no-files-found: error
          retention-days: 14

  api:
    name: API (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: api/pom.xml
      # Formatting check, unit tests, Testcontainers integration tests and JaCoCo.
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-jacoco
          path: api/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types match the contract
        run: |
          npm run gen:api
          if ! git diff --exit-code -- .; then
            echo "::error::Generated API types are out of date. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            context: agent
            dockerfile: agent/Dockerfile
          - image: api
            context: api
            dockerfile: api/Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
          # Simulated hosts build the agent from source, so their context is the repo root.
          - image: host-ubuntu-hardened
            context: .
            dockerfile: deploy/hosts/ubuntu-hardened/Dockerfile
          - image: host-debian-legacy
            context: .
            dockerfile: deploy/hosts/debian-legacy/Dockerfile
          - image: host-rocky-web
            context: .
            dockerfile: deploy/hosts/rocky-web/Dockerfile
          - image: host-alpine-drifting
            context: .
            dockerfile: deploy/hosts/alpine-drifting/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Phase 1 only proves every image builds; nothing is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: driftwatch-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  e2e:
    name: End-to-end (compose smoke test)
    needs: [config, contract, agent, api, web, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Faster scans and drift than the local demo defaults, so the run stays short.
      DRIFTWATCH_INTERVAL: 10s
      DRIFT_PERIOD: 20
      SMOKE_TIMEOUT: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start stack
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Dump service state and logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
      - name: Tear down
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
