# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps arrive as individual PRs because they need review.
# The cooldown matches the project rule of only adopting releases that are at least
# two weeks old.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /agent
      - /api
      - /web
      - /deploy/hosts/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
